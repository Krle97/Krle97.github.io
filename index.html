<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA Manifest (now at root) -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />

  <title>S3-Geek Controller</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin: 10px 0 16px;
      color: #1a1a2e;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    #status {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: #e9ecef;
      font-weight: 500;
      color: #495057;
      transition: 0.2s;
      margin-bottom: 4px;
    }
    #status.connected {
      background: #d4edda;
      color: #155724;
    }
    #status.error {
      background: #f8d7da;
      color: #721c24;
    }
    #connectBtn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #28a745;
      color: #fff;
      cursor: pointer;
      transition: 0.15s;
      touch-action: manipulation;
    }
    #connectBtn:active { transform: scale(0.97); }
    #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .cmd-btn {
      padding: 18px 0;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      transition: 0.15s;
      touch-action: manipulation;
    }
    .cmd-btn:active { transform: scale(0.95); }
    .cmd-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .cmd-btn:nth-child(2) { background: #6c757d; }
    .cmd-btn:nth-child(3) { background: #dc3545; }
    #log {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 12px 14px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.6;
      flex: 1;
      min-height: 80px;
    }
    #log .time { color: #6c7086; }
    #log .ok { color: #a6e3a1; }
    #log .err { color: #f38ba8; }
    #log .info { color: #89b4fa; }
    .footer {
      text-align: center;
      font-size: 13px;
      color: #6c757d;
      margin-top: 12px;
    }
    #installBanner {
      display: none;
      background: #ffc107;
      color: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>🔧 S3‑Geek</h1>

<div id="installBanner">📲 Add to Home Screen for fullscreen app experience</div>

<div class="card">
  <div id="status">⚡ Disconnected</div>
  <button id="connectBtn">🔗 Connect</button>
</div>

<div class="card">
  <div class="btn-grid">
    <button class="cmd-btn" data-cmd="1">Cmd 1</button>
    <button class="cmd-btn" data-cmd="2">Cmd 2</button>
    <button class="cmd-btn" data-cmd="3">Cmd 3</button>
  </div>
</div>

<div class="card" style="flex:1;">
  <div id="log"><span class="time">⏺</span> <span class="info">Ready — tap Connect</span></div>
</div>

<div class="footer">BLE · no app · no WiFi</div>

<script>
// ============================================================
//  UUIDs — match your App Inventor / gatt_svr.c exactly
// ============================================================
const SERVICE_UUID        = "12345678-1234-1234-1234-123456789abc";
const CHARACTERISTIC_UUID = "1234abcd-ef01-1234-1234-123456789abc";
const DEVICE_NAME         = "S3-Geek-Controller";

// ============================================================
//  PWA detection
// ============================================================
const installBanner = document.getElementById('installBanner');
if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
  installBanner.style.display = 'none';
} else if (/android/i.test(navigator.userAgent)) {
  installBanner.style.display = 'block';
}

// ============================================================
//  DOM refs
// ============================================================
const statusEl = document.getElementById('status');
const logEl    = document.getElementById('log');
const connectBtn = document.getElementById('connectBtn');
const cmdBtns    = document.querySelectorAll('.cmd-btn');

let device = null;
let characteristic = null;

// ============================================================
//  Log helper
// ============================================================
function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString();
  const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info';
  const entry = document.createElement('div');
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="${cls}">${msg}</span>`;
  logEl.appendChild(entry);
  logEl.scrollTop = logEl.scrollHeight;
}

// ============================================================
//  Status helper
// ============================================================
function setStatus(text, state = '') {
  statusEl.textContent = text;
  statusEl.className = state;
}

// ============================================================
//  Connect
// ============================================================
async function connect() {
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }

  try {
    connectBtn.disabled = true;
    connectBtn.textContent = '⏳ Scanning...';
    setStatus('🔍 Scanning...', '');

    log('Scanning for ' + DEVICE_NAME + ' ...');

    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: DEVICE_NAME }],
      optionalServices: [SERVICE_UUID]
    });

    log('✅ Found: ' + device.name, 'ok');

    const server = await device.gatt.connect();
    log('🔗 GATT connected', 'ok');

    const service = await server.getPrimaryService(SERVICE_UUID);
    log('📡 Service found', 'ok');

    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
    log('📝 Characteristic found — ready!', 'ok');

    setStatus('✅ Connected to ' + device.name, 'connected');
    connectBtn.textContent = '🔌 Disconnect';
    connectBtn.disabled = false;

    cmdBtns.forEach(btn => btn.disabled = false);

    device.addEventListener('gattserverdisconnected', onDisconnect);

  } catch (err) {
    log('❌ ' + err.message, 'err');
    setStatus('❌ ' + err.message, 'error');
    connectBtn.textContent = '🔗 Retry';
    connectBtn.disabled = false;
    device = null;
    characteristic = null;
  }
}

function onDisconnect() {
  log('⚠️ Disconnected', 'err');
  setStatus('⚡ Disconnected', '');
  connectBtn.textContent = '🔗 Connect';
  cmdBtns.forEach(btn => btn.disabled = true);
  characteristic = null;
  device = null;
}

// ============================================================
//  Send command (single byte)
// ============================================================
async function sendCommand(cmdId) {
  if (!characteristic) {
    log('⚠️ Not connected — tap Connect first', 'err');
    return;
  }

  try {
    const data = new Uint8Array([cmdId]);
    await characteristic.writeValue(data);
    log(`📤 Sent: 0x${cmdId.toString(16).padStart(2, '0')} (${cmdId})`, 'ok');
  } catch (err) {
    log('❌ Write failed: ' + err.message, 'err');
    onDisconnect();
  }
}

// ============================================================
//  Event listeners
// ============================================================
connectBtn.addEventListener('click', connect);

cmdBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = parseInt(btn.dataset.cmd, 10);
    sendCommand(cmd);
  });
});

// ============================================================
//  Init — disable buttons until connected
// ============================================================
cmdBtns.forEach(btn => btn.disabled = true);
log('📱 Open this page in Chrome on Android');
log('💡 Tap Connect and select your S3‑Geek');

// ============================================================
//  Register Service Worker (for PWA offline support)
// ============================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('✅ Service Worker registered'))
    .catch((err) => console.log('⚠️ SW registration failed:', err));
}
</script>
</body>
</html>
